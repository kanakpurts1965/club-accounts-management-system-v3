<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Club Accounts Management System</title>

<link rel="icon" href="123.png.png">

<link rel="stylesheet" href="assets/css/main.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<link rel="stylesheet" href="assets/css/login.css">

</head>

<body>

<div class="login-container">

<div class="left-panel">

<img src="123.png.png"

id="clubLogo"

class="club-logo">

<h1>

Kanakpur Tarun Sangha

</h1>

<h3>

Club Accounts Management System

</h3>

<p>

Transparency • Digital Accounting • Smart Management

</p>

</div>

<div class="right-panel">

<div class="login-card">

<h2>

Welcome

</h2>

<p>

Select Login Type

</p>

<!-- LOGIN TAB -->

<div class="login-tabs">

<button

class="tab-btn active"

onclick="showLogin('member')">

👤 Member

</button>

<button

class="tab-btn"

onclick="showLogin('admin')">

👨‍💼 Admin

</button>

</div>

<!-- MEMBER LOGIN -->

<div

id="memberLogin"

class="login-form">

<form id="memberLoginForm">

<div class="form-group">

<label>

Mobile Number

</label>

<input

type="text"

id="memberMobile"

placeholder="Enter Mobile Number"

required>

</div>

<div class="form-group">

<label>

Password

</label>

<input

type="password"

id="memberPassword"

placeholder="Enter Password"

required>

</div>

<button

type="submit"

class="btn btn-primary"

style="width:100%;">

Member Login

</button>

</form>

</div>

<!-- ADMIN LOGIN -->

<div

id="adminLogin"

class="login-form"

style="display:none;">

<form id="adminLoginForm">

<div class="form-group">

<label>

Mobile / Email

</label>

<input

type="text"

id="adminId"

placeholder="Enter Mobile or Email"

required>

</div>

<div class="form-group">

<label>

Password

</label>

<input

type="password"

id="adminPassword"

placeholder="Enter Password"

required>

</div>

<button

type="submit"

class="btn btn-success"

style="width:100%;">

Admin Login

</button>

</form>

</div>
<!-- ================= MASTER PIN MODAL ================= -->

<div class="modal" id="masterPinModal">

<div class="modal-box" style="max-width:420px;">

<h2 style="text-align:center;">

👑 Master Security

</h2>

<p style="text-align:center;margin:15px 0;">

Enter Master PIN

</p>

<div class="form-group">

<input

type="password"

id="masterPin"

placeholder="Enter Master PIN"

autocomplete="off">

</div>

<div style="display:flex;gap:10px;margin-top:20px;">

<button

class="btn"

style="flex:1;"

onclick="closeModal('masterPinModal')">

Cancel

</button>

<button

class="btn btn-danger"

style="flex:1;"

onclick="verifyMasterPin()">

Continue

</button>

</div>

</div>

</div>
<!-- HIDDEN MASTER LOGIN -->

<div

id="masterLogin"

style="display:none; margin-top:30px;">

<hr>

<h3>

👑 Master Admin Login

</h3>

<form id="masterLoginForm">

<div class="form-group">

<label>

Email

</label>

<input

type="email"

id="masterEmail"

placeholder="Master Email">

</div>

<div class="form-group">

<label>

Password

</label>

<input

type="password"

id="masterPass"

placeholder="Master Password">

</div>

<button

type="submit"

class="btn btn-danger"

style="width:100%;">

Master Login

</button>

</form>

</div>


</div>

</div>

</div>

<!-- ================= Loader ================= -->

<div id="loader" style="display:none;">

<div class="loader-box">

<img src="123.png.png" width="80">

<h3>Loading...</h3>

</div>

</div>

<!-- ================= Toast ================= -->

<div id="toastContainer"></div>

<!-- ================= Script ================= -->

<script>

/* ===========================
   DESKTOP MASTER
=========================== */

document.addEventListener("keydown",(e)=>{

if(e.ctrlKey && e.shiftKey && e.key.toLowerCase()=="a"){

openModal("masterPinModal");

}

});

/* ===========================
   MOBILE MASTER
=========================== */

const logo=document.getElementById("clubLogo");

let holdTimer;

logo.addEventListener("touchstart",()=>{

holdTimer=setTimeout(()=>{

openModal("masterPinModal");

},5000);

});

logo.addEventListener("touchend",()=>{

clearTimeout(holdTimer);

});

logo.addEventListener("touchcancel",()=>{

clearTimeout(holdTimer);

});

/* ===========================
   VERIFY PIN
=========================== */

function verifyMasterPin(){

const pin=document.getElementById("masterPin").value;

if(pin==="123456"){

closeModal("masterPinModal");

document.getElementById("masterLogin").style.display="block";

document.getElementById("masterPin").value="";

}else{

alert("Invalid Master PIN");

}
}

</script>

<script type="module" src="assets/js/firebase.js"></script>

<script type="module" src="assets/js/auth.js"></script>

<script src="assets/js/app.js"></script>

</body>

</html>
