<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>

Login

</title>

<link rel="icon"
href="assets/images/logo.png">

<link rel="stylesheet"
href="assets/css/main.css">

<link rel="stylesheet"
href="assets/css/layout.css">

<link rel="stylesheet"
href="assets/css/login.css">

</head>

<body>

<div class="login-page">

<div class="login-box">

<img
src="assets/images/logo.png"
class="login-logo">

<h1>

Club Accounts Management System

</h1>

<p>

Designed & Developed by Tanmoy Adak

</p>

<form id="loginForm">

<input

type="email"

id="email"

placeholder="Email"

required>

<input

type="password"

id="password"

placeholder="Password"

required>

<button

class="primary-btn"

type="submit">

Login

</button>

</form>

<div class="login-footer">

<a
href="#"
id="forgotPassword">

Forgot Password?

</a>

</div>

</div>

</div>

<script type="module"
src="assets/js/firebase.js">

</script>

<script type="module"
src="assets/js/auth.js">

</script>

</body>

</html>
