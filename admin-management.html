<link rel="stylesheet" href="assets/css/admin-management.css">

</head>

<body>

<div class="dashboard">

<!-- Sidebar -->

<aside class="sidebar">

<div class="logo">

<img src="assets/images/logo.png" alt="Logo">

<h2>

Club Accounts

</h2>

</div>

<nav>

<ul>

<li><a href="dashboard.html">🏠 Dashboard</a></li>

</a>

</li>

<li><a href="settings.html">⚙ Settings</a></li>

</ul>

</nav>

</aside>

<!-- Main -->

<main class="content">

<header class="admin-header">

<h1>

Admin Management

</h1>

<button

class="add-admin-btn"

onclick="openAdminModal()">

+ Add Admin

</button>

</header>

<div class="admin-card">

<input

type="text"

id="adminSearch"

placeholder="Search Admin..."

onkeyup="searchAdmin()">

</div>

<div class="admin-card">

<table class="admin-table">

<thead>

<tr>

<th>Name</th>

<th>Mobile</th>

<th>Email</th>

<th>Role</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody id="adminTable">

</tbody>

</table>

</div>


  <!-- ADD / EDIT ADMIN MODAL -->

<div id="adminModal" class="modal">

<div class="modal-content">

<h2>

Add New Admin

</h2>

<form id="adminForm">

<div class="form-group">

<label>Full Name</label>

<input
type="text"
id="adminName"
required>

</div>

<div class="form-group">

<label>Mobile Number</label>

<input
type="tel"
id="adminMobile"
required>

</div>

<div class="form-group">

<label>Email</label>

<input
type="email"
id="adminEmail"
required>

</div>

<div class="form-group">

<label>Role</label>

<select id="adminRole">

<option>

Master Admin

</option>

<option>

Admin

</option>

</select>

</div>

<div class="form-group">

<label>Status</label>

<select id="adminStatus">

<option>

Active

</option>

<option>

Inactive

</option>

</select>

</div>

<div style="margin-top:20px;">

<button
type="submit"
class="save-btn">

Save Admin

</button>

<button
type="button"
class="cancel-btn"
onclick="closeAdminModal()">

Cancel

</button>

</div>

</form>

</div>

</div>

<script type="module" src="assets/js/firebase.js"></script>

<script type="module" src="assets/js/admin-management.js"></script>

</body>

</html>
